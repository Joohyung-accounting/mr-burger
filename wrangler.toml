# Cloudflare Workers, serving www/ as static assets.
#
# The game is a static site with no build step, so there is no Worker script -
# an assets-only deployment is enough. This is what `npx wrangler deploy`
# expects, which is the deploy command Cloudflare's dashboard pre-fills.
name = "mr-burger"
compatibility_date = "2026-08-09"

[assets]
directory = "./www"

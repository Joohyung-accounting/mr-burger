# Cloudflare Worker. Static game in www/, small API in worker/.
#
# Assets are served straight from the edge for any path that matches a file;
# the Worker only runs for /api/*, so the game costs nothing to serve.
name = "mr-burger"
main = "worker/index.js"
compatibility_date = "2026-08-09"

[assets]
directory = "./www"
binding = "ASSETS"

# leaderboard + cloud saves
[[d1_databases]]
binding = "DB"
database_name = "mr-burger"
database_id = "63ca09b0-9ca6-4af4-a06f-bce9ba3f9680"

# one Durable Object per co-op room code
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
